name: Publicar site no GitHub Pages (só os arquivos do site)

# Publica SÓ o que scripts/build-pages.js lista (páginas, data.js, lib/, JSONs de dados).
# CLAUDE.md, QUANT.md, agentes/, tests/, scripts/, .claude/ ... NÃO vão ao ar.
#
# PRÉ-REQUISITO MANUAL: Settings -> Pages -> Source = "GitHub Actions".
#
# Gatilhos: push na main; fim de cada Action que commita dados (commits feitos com
# GITHUB_TOKEN NAO disparam workflows de push, por isso o workflow_run); manual; e um cron de seguranca.

on:
  push:
    branches: [main]
  workflow_run:
    workflows:
      - "Atualizar benchmark de aporte equivalente (benchmark-data.js)"
      - "Briefing diário de mercado"
      - "Fechamento mensal da curva de patrimônio (data.js)"
      - "Snapshot diário do patrimônio (networth-history.json)"
      - "Atualizar dados on-chain (aba Ciclo · ferramentas.html)"
      - "Sincroniza data.js embutido no emprestimos.html"
      - "Dados da Mesa DeFi (quant.json + yields.json)"
    types: [completed]
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: '30 11 * * *'   # ~08:30 BRT, depois de todos os robos de dados

permissions:
  contents: read
  pages: write
  id-token: write
  actions: read   # so leitura: o passo "Esperar o artefato" lista os artefatos desta execucao

concurrency:
  group: pages
  # NAO cancelar deploy em andamento. Era 'true' e em 12/11/2026 as 17:30 o deploy falhou com
  # 'No artifacts named github-pages were found for this workflow run' — o upload tinha marcado
  # sucesso e o deploy nao achou o artefato. Com varios robos commitando em sequencia (4
  # publicacoes em 15 minutos naquele dia), um run novo cancelava o anterior no meio do deploy.
  # cancel-in-progress: false e o que o proprio template oficial do GitHub Pages usa: os runs
  # enfileirados entre o em andamento e o ultimo sao descartados, mas um deploy ja iniciado
  # termina. Mais lento, nao perde publicacao.
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy2.outputs.page_url || steps.deploy1.outputs.page_url }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: main
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
      - name: Montar _site (falha se faltar arquivo ou houver referencia quebrada)
        run: node scripts/build-pages.js _site
      - uses: actions/configure-pages@v5
      # O artefato leva o numero da tentativa no nome. Sem isso, "Re-run jobs" sobe um 2o artefato
      # 'github-pages' na MESMA execucao e o deploy morre com "Multiple artifacts ... Artifact count
      # is 2" (visto em 23/11/2026, run #134) — re-rodar nunca funcionaria.
      - uses: actions/upload-pages-artifact@v4
        with:
          name: github-pages-${{ github.run_attempt }}
          path: _site
      # A API de artefatos do GitHub as vezes demora a listar o que acabou de ser enviado, e o
      # deploy-pages consulta 1 segundo depois do upload: "No artifacts named github-pages were
      # found" (12/11 e 23/11/2026, runs #132 e #133, upload ok e deploy falhando). Espera aparecer.
      - name: Esperar o artefato aparecer na API (ate 90s)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          NAME="github-pages-${{ github.run_attempt }}"
          for i in $(seq 1 18); do
            N=$(gh api "repos/${{ github.repository }}/actions/runs/${{ github.run_id }}/artifacts" --jq ".artifacts | map(select(.name==\"${NAME}\")) | length" || echo 0)
            echo "tentativa ${i}: ${N} artefato(s) '${NAME}'"
            [ "${N}" = "1" ] && exit 0
            sleep 5
          done
          echo "::warning::artefato '${NAME}' nao apareceu na API em 90s; tentando o deploy mesmo assim"
      - id: deploy1
        uses: actions/deploy-pages@v4
        continue-on-error: true
        with:
          artifact_name: github-pages-${{ github.run_attempt }}
      # Rede de seguranca: se o deploy falhar por qualquer instabilidade transitoria, tenta 1 vez mais.
      - name: Aguardar antes de repetir o deploy
        if: steps.deploy1.outcome == 'failure'
        run: sleep 30
      - id: deploy2
        if: steps.deploy1.outcome == 'failure'
        uses: actions/deploy-pages@v4
        with:
          artifact_name: github-pages-${{ github.run_attempt }}
