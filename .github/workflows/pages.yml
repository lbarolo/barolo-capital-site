name: Publicar site no GitHub Pages (só os arquivos do site)

# Publica SÓ o que scripts/build-pages.js lista (páginas, data.js, lib/, JSONs de dados).
# CLAUDE.md, QUANT.md, agentes/, tests/, scripts/, .claude/ ... NÃO vão ao ar.
#
# PRÉ-REQUISITO MANUAL: Settings -> Pages -> Source = "GitHub Actions".
#
# Gatilhos: push na main; fim de cada Action que commita dados (commits feitos com
# GITHUB_TOKEN NAO disparam workflows de push, por isso o workflow_run); manual; e um cron de seguranca.

on:
  push:
    branches: [main]
  workflow_run:
    workflows:
      - "Atualizar benchmark de aporte equivalente (benchmark-data.js)"
      - "Briefing diário de mercado"
      - "Fechamento mensal da curva de patrimônio (data.js)"
      - "Snapshot diário do patrimônio (networth-history.json)"
      - "Atualizar dados on-chain (aba Ciclo · ferramentas.html)"
      - "Sincroniza data.js embutido no emprestimos.html"
    types: [completed]
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: '30 11 * * *'   # ~08:30 BRT, depois de todos os robos de dados

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  # NAO cancelar deploy em andamento. Era 'true' e em 12/11/2026 as 17:30 o deploy falhou com
  # 'No artifacts named github-pages were found for this workflow run' — o upload tinha marcado
  # sucesso e o deploy nao achou o artefato. Com varios robos commitando em sequencia (4
  # publicacoes em 15 minutos naquele dia), um run novo cancelava o anterior no meio do deploy.
  # cancel-in-progress: false e o que o proprio template oficial do GitHub Pages usa: os runs
  # enfileirados entre o em andamento e o ultimo sao descartados, mas um deploy ja iniciado
  # termina. Mais lento, nao perde publicacao.
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: main
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
      - name: Montar _site (falha se faltar arquivo ou houver referencia quebrada)
        run: node scripts/build-pages.js _site
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
